name: Emulator QA

on:
  push:
    branches: [main]
    paths: ['qa/**', 'src/**', 'res/**', 'AndroidManifest.xml', '.github/workflows/emulator-qa.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 34 and build-tools 34.0.0
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: ./qa/qa.sh
