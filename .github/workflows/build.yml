name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 34 and build-tools 34.0.0
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: wktalkclip-apk
          path: out/wktalkclip.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/wktalkclip.apk \
            --target "$GITHUB_SHA" \
            --title "wktalkclip build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug-signed APK built from ${GITHUB_SHA::7}. Install on the phone: download wktalkclip.apk and allow installs from this source." \
            --latest
