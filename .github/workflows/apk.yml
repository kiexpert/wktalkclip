name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 34 and build-tools 34.0.0
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Restore signing key (created once, kept in the Actions cache)
        uses: actions/cache@v4
        with:
          path: wktalkclip.jks
          key: apk-signing-v1

      - name: Prefer the signing key from the repository secret
        env:
          KS_B64: ${{ secrets.APK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > wktalkclip.jks
            echo "signing key: repository secret"
          else
            echo "signing key: Actions cache (no repository secret set)"
          fi

      - name: Plain-Java checks
        run: ./test.sh

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASS }}
        run: ./build.sh

      - name: Show the signing fingerprint and refuse a changed key
        run: |
          # An update only installs over the old app when the key is the same. A new key would
          # publish an APK that cannot update in place, so the build stops before the release.
          LINE=$("$ANDROID_SDK/build-tools/34.0.0/apksigner" verify --print-certs out/wktalkclip.apk | grep 'SHA-256 digest')
          echo "$LINE"
          FP=$(echo "$LINE" | head -1 | awk '{print $NF}')
          EXPECTED=$(tr -d ' \r\n' < signing-fingerprint.txt)
          if [ "$FP" != "$EXPECTED" ]; then
            echo "SIGNING KEY CHANGED: got $FP, expected $EXPECTED. Not publishing." >&2
            exit 1
          fi
          echo "signing fingerprint matches the pinned one"

      - name: Show version code
        run: |
          "$ANDROID_SDK/build-tools/34.0.0/aapt2" dump badging out/wktalkclip.apk | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*versionName='\([^']*\)'.*/VERSION versionCode=\1 versionName=\2/p"

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: wktalkclip-apk
          path: out/wktalkclip.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          { echo "Built from ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})."; echo; cat RELEASE_NOTES.md; } > release-notes.txt
          gh release create "$TAG" out/wktalkclip.apk \
            --target "$GITHUB_SHA" \
            --title "wktalkclip build ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.txt \
            --latest
