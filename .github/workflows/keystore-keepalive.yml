name: Keep the signing key cache alive

# GitHub drops a cache that has not been used for 7 days. The signing key lives in the Actions
# cache, so it is opened every two days; losing it would make the next build unable to update the
# installed app in place. The run fails loudly if the cache is already gone.
on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: wktalkclip.jks
          key: apk-signing-v1
          fail-on-cache-miss: true
      - run: echo "signing key cache is alive"
