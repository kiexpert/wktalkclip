name: Emulator voice QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['qa/voice.sh', 'src/**', '.github/workflows/emulator-voice.yml']

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # RED: the pre-fix source (86627c3) with its language switched to English.
          - name: red-old-en
            ref: 86627c3a83bad2514b72c780d2779d4cf926b83e
            patch: true
            lang: en
            wait: 60
          # GREEN: this build in English and in Korean (10 minute model wait).
          - name: green-new-en
            ref: ${{ github.sha }}
            patch: false
            lang: en
            wait: 120
          - name: green-new-ko
            ref: ${{ github.sha }}
            patch: false
            lang: ko
            wait: 420
    name: voice ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: app
      - uses: actions/checkout@v4
        with:
          path: qa-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the APK under test
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          export ANDROID_SDK="$SDK"
          if [ "${{ matrix.patch }}" = true ]; then sed -i 's/"ko-KR"/"en-US"/' app/src/app/wktalkclip/MainActivity.java; fi
          (cd app && ./build.sh)
          mkdir -p qa-src/apk && cp app/out/wktalkclip.apk qa-src/apk/wktalkclip.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Virtual microphone (null sink) and speech clip
        working-directory: qa-src
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pulseaudio pulseaudio-utils ffmpeg > /dev/null
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=vmic sink_properties=device.description=vmic
          pactl set-default-source vmic.monitor
          mkdir -p clip
          pip install -q gTTS > /dev/null 2>&1 || true
          if [ "${{ matrix.lang }}" = en ]; then
            TEXT="Hello everyone. Let us start the meeting. The first item is the schedule. Please send me the notes."; L=en
          else
            TEXT="안녕하세요. 오늘 회의를 시작하겠습니다. 첫 번째 안건은 일정입니다. 메모를 보내 주세요."; L=ko
          fi
          python3 -c "from gtts import gTTS; gTTS('$TEXT', lang='$L').save('clip/tts.mp3')"
          ffmpeg -loglevel error -y -i clip/tts.mp3 clip/voice.wav
          ls -la clip
          ( while true; do paplay --device=vmic clip/voice.wav; sleep 1; done ) > /dev/null 2>&1 &

      - name: Run on emulator (Play image, host audio allowed)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PULSE_SOURCE: vmic.monitor
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          working-directory: qa-src
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -allow-host-audio
          script: ./qa/voice.sh apk/wktalkclip.apk ${{ matrix.lang }} ${{ matrix.wait }}
