name: Keystore export (one-time, sealed to the caller's public key)

# Called once by a workflow that holds a token able to write this repo's secrets.
# The caller passes an RSA PUBLIC key; the keystore leaves this run only encrypted
# to it, so the public artifact is useless to anyone without the caller's private key.
# Nothing secret is printed.

on:
  workflow_dispatch:
    inputs:
      pubkey_b64:
        description: base64 of the caller's PEM RSA public key
        required: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Restore signing key (the same cache entry apk.yml uses)
        uses: actions/cache/restore@v4
        with:
          path: wktalkclip.jks
          key: apk-signing-v1
          fail-on-cache-miss: true

      - name: Seal the keystore to the caller's public key
        env:
          PUB_B64: ${{ inputs.pubkey_b64 }}
        run: |
          set -eu
          umask 077
          echo "$PUB_B64" | base64 -d > pub.pem
          openssl pkey -pubin -in pub.pem -noout
          openssl rand -hex 32 > k.txt
          mkdir out
          openssl enc -aes-256-cbc -pbkdf2 -salt -in wktalkclip.jks -out out/ks.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.txt -out out/k.enc
          rm -f k.txt
          sha256sum wktalkclip.jks | cut -c1-16 > out/ks.sha16
          echo "sealed: $(wc -c < out/ks.enc) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-sealed
          path: out/
          retention-days: 1
