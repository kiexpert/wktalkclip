name: Release signers

# One-off check: prints the signing certificate fingerprint (public information) and the version
# code of the APK of every release, so it is known which releases can be updated by a newer build.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-signers.yml'

permissions:
  contents: read

jobs:
  signers:
    runs-on: ubuntu-latest
    steps:
      - name: Install the build tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "build-tools;34.0.0" > /dev/null
          echo "BT=$SDK/build-tools/34.0.0" >> "$GITHUB_ENV"

      - name: Fingerprint and version code of every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          gh release list --repo "${{ github.repository }}" --limit 300 --json tagName --jq '.[].tagName' | sort -V > tags.txt
          echo "releases: $(wc -l < tags.txt)"
          while read -r tag; do
            d="dl/$tag"; mkdir -p "$d"
            if ! gh release download "$tag" --repo "${{ github.repository }}" --pattern wktalkclip.apk --dir "$d" >/dev/null 2>&1; then
              echo "SIGNER $tag no-apk"; continue
            fi
            fp=$("$BT/apksigner" verify --print-certs "$d/wktalkclip.apk" 2>/dev/null | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')
            vc=$("$BT/aapt2" dump badging "$d/wktalkclip.apk" 2>/dev/null | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
            sz=$(stat -c %s "$d/wktalkclip.apk")
            echo "SIGNER $tag versionCode=${vc:-?} bytes=$sz sha256=${fp:-unreadable}"
          done < tags.txt
